<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}{% endblock %}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
			crossorigin="anonymous"></script>
	{% load static %}
	<script src="https://kit.fontawesome.com/b5718073e0.js" crossorigin="anonymous"></script>
	<style>
		@media (max-width:990px) {
			.table-responsive-wrapper {
				max-width: 700px;
				overflow-x: auto;
			}
		}
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-lg" style="background-color: #f2f2f2;">
		<div class="container">
			<div class="d-flex">
				<span class="navbar-brand fw-bold">ONG</span>
				<a class="icon-link text-decoration-none" href="{% url 'home' %}">
					<i class="fa-solid fa-house"></i>
					<span class="text-decoration-underline">Home</span>
				</a>

			</div>

			<div class="d-flex">
				{% if user.is_authenticated %}
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
						   aria-expanded="false">
							{{ user.username }}
						</a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" href="{% url 'minha-conta' %}">Minha Conta</a></li>
							<li><a class="dropdown-item" href="{% url 'gerenciar-animais' %}">Gerenciar Animais</a></li>
							<li>
								<hr class="dropdown-divider">
							</li>
							<li>
								<form action="{% url 'logout' %}" method="post">
									{% csrf_token %}
									<button type="submit" class="dropdown-item">Sair</button>
								</form>
							</li>
						</ul>
					</li>
				</ul>
				{% endif %}
			</div>
		</div>
	</nav>
	{% if messages %}
		<div class="messages">
			{% for message in messages %}
				<div class="container-fluid position-fixed top-0 end-0 pt-4 pe-5" style="z-index: 100;width: fit-content;">
					<div class="alert {{ message.tags }} alert-dismissible" role="alert" >
						<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
						{{ message }}
					</div>
				</div>
			{% endfor %}
		</div>
		<script>
			const btns = document.querySelectorAll('.btn-close');
			setTimeout(() => {
				btns.forEach((btn) => btn.click());
			}, 5000);
		</script>
	{% endif %}

		Futuramente pode ser usado quando houver as demais funcionalidades

					aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
				<div class="btn-toolbar w-100 flex-column flex-lg-row p-3 gap-2 gap-lg-5" role="toolbar" aria-label="Toolbar with button groups">
					<button type="button" class="btn btn-primary flex-grow-1 fw-bold">Quero adotar um pet</button>
					<button type="button" class="btn btn-primary flex-grow-1 fw-bold">Quero doar um pet</button>
					<button type="button" class="btn btn-primary flex-grow-1 fw-bold">Meu pet está perdido</button>

				</div>
			</div>
		</div>
	</nav>-->
	<main class="container my-5 pb-3">
		{% block content %}{% endblock %}
	</main>

</body>
</html>

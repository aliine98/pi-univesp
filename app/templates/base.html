<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<title>{% block title %}{% endblock %}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
			crossorigin="anonymous"></script>
	{% load static %}
	<link href="{% static 'css/style.css' %}" rel="stylesheet" type="text/css"/>
	<script src="https://kit.fontawesome.com/b5718073e0.js" crossorigin="anonymous"></script>
</head>
<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container">
			<div class="d-flex">
				<span class="navbar-brand">ONG</span>
				<a class="icon-link text-decoration-none" href="{% url 'home' %}">
					<i class="fa-solid fa-house"></i>
					<span class="text-decoration-underline">Home</span>
				</a>

			</div>

			<div class="d-flex">
				{% if user.is_authenticated %}
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
						   aria-expanded="false">
							{{ user.username }}
						</a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" href="#">Minha Conta</a></li>
							{% if user.is_superuser %}
							<li><a class="dropdown-item" href="#">Painel Administrativo</a></li>
							{% endif %}
							<li>
								<hr class="dropdown-divider">
							</li>
							<li>
								<form action="{% url 'logout' %}" method="post">
									{% csrf_token %}
									<button type="submit" class="dropdown-item">Log out</button>
								</form>
							</li>
						</ul>
					</li>
				</ul>
				{% else %}
				<a class="btn btn-primary fw-bold" href="{% url 'login' %}">Entrar</a>
				{% endif %}
			</div>
		</div>
	</nav>
	<nav class="navbar navbar-expand-lg" style="background-color: #f2f2f2;">
		<div class="container">
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
					aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
				<div class="btn-toolbar w-100 flex-column flex-lg-row p-3 gap-2 gap-lg-5" role="toolbar" aria-label="Toolbar with button groups">
					<button type="button" class="btn btn-primary flex-grow-1 fw-bold">Quero adotar um pet</button>
					<button type="button" class="btn btn-primary flex-grow-1 fw-bold">Quero doar um pet</button>
					<button type="button" class="btn btn-primary flex-grow-1 fw-bold">Meu pet está perdido</button>
					<button type="button" class="btn btn-primary flex-grow-1 fw-bold">Quero Ajudar</button>
				</div>
			</div>
		</div>
	</nav>
	<main class="container position-absolute top-50 start-50 translate-middle">
		{% block content %}{% endblock %}
	</main>

</body>
</html>

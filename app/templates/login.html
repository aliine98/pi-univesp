{% extends 'base.html' %}

{% load static %}

{% load crispy_forms_tags %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="col col-lg-6 d-flex align-items-center mx-auto" style="height: 80vh;">
	<div class="w-100">
        <h3>Autenticação</h3>
        <hr>
        <form action="" method="POST">
        
            {% csrf_token %}
        
            {{ form|crispy }}
        
            <button type="submit" class="btn btn-primary mt-3">Entrar</button>
        
        </form>
	</div>
</div>

{% endblock %}

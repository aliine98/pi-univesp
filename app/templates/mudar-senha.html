{% extends 'base.html' %}

{% load static %}

{% load crispy_forms_tags %}
{% block title %}Alterar Senha{% endblock %}
{% block content %}

<div>
	<h3>Alterar Senha</h3>
	<hr>
	<div class="col col-lg-6">
		<div class="w-100">
			<form action="" method="POST">

				{% csrf_token %}

				{{ form|crispy }}
				<button type="submit" class="btn btn-primary mt-3">Salvar</button>

			</form>
		</div>
	</div>
</div>

{% endblock %}
